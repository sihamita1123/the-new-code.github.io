<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locker Letters</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f3ef; --ink:#1f2433; --muted:#69707f; --line:#e6e2d8;
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef0ff;
  --gold:#b45309; --goldbg:#fef3c7; --green:#0e9f6e; --greenbg:#def7ec;
  --red:#c81e1e; --redbg:#fee2e2;
  --shadow:0 8px 24px rgba(31,36,51,.08);
  --font:'Segoe UI',system-ui,-apple-system,'Noto Sans',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html,body{min-height:100%}
body{
  font-family:var(--font); color:var(--ink); line-height:1.55;
  background:
    radial-gradient(1100px 480px at 88% -60px,#e9e5ff 0%,transparent 60%),
    radial-gradient(900px 420px at -10% 25%,#fdf1d8 0%,transparent 55%),
    var(--bg);
}
button{font:inherit}
b{font-weight:700}
h1,h2,h3,h4{line-height:1.25}

/* layout */
.page{max-width:980px;margin:0 auto;padding:6px 16px 50px}
.landing{max-width:880px;margin:0 auto;padding:10px 16px 50px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto;padding:14px 16px 4px;flex-wrap:wrap;gap:10px}
.brandrow{display:flex;align-items:center;gap:10px;font-size:17px}
.tright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* brand */
.logo{display:inline-flex;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.logo.big{width:64px;height:64px;font-size:26px;border-radius:16px}
.hero{text-align:center;padding:44px 0 24px}
.hero h1{font-size:34px;margin:14px 0 6px}
.tag{color:var(--muted);font-size:16px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chead h3{font-size:17px}
.card h4{margin:4px 0 6px}
.muted{color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.role{cursor:pointer;transition:transform .15s}
.role:hover{transform:translateY(-3px)}
.role p{color:var(--muted);font-size:14px;margin:6px 0 16px}
.role-ic{width:44px;height:44px;border-radius:12px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.role-ic.stud{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.role-ic.vol{background:linear-gradient(135deg,#f59e0b,#ef4444)}

/* buttons, badges, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:600;background:#e8e5dd;color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.gold{background:var(--goldbg);color:var(--gold);border-color:#fcd34d}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#ece9e0;color:var(--muted)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.gold{background:var(--goldbg);color:var(--gold)}
.badge.green{background:var(--greenbg);color:var(--green)}
.badge.red{background:var(--redbg);color:var(--red)}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:72px;resize:vertical;margin-bottom:6px}
.qlbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);max-width:180px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.auth{max-width:460px;margin:0 auto}

/* student dashboard */
.pts-big{font-size:44px;font-weight:800;color:var(--brand);line-height:1}
.hero-card{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.goals{flex:1;min-width:240px}
.goal{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.pbar{height:10px;background:#ece9e0;border-radius:99px;overflow:hidden;margin:8px 0 12px}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .4s}
.pbar.gold>div{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.cyclechip{display:flex;align-items:center;gap:9px;background:var(--greenbg);color:#065f46;padding:10px 14px;border-radius:12px;font-size:14px;margin:0 0 6px;flex-wrap:wrap}
.banner{padding:12px 16px;border-radius:14px;font-weight:600;margin:14px 0}
.goldb{background:var(--goldbg);color:var(--gold);border:1px solid #fcd34d}
.stitle{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.span2{grid-column:1/-1}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;flex:0 0 auto}
.ldot.red{background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* riddle */
.timer{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.timer b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:#ece9e0;border-radius:99px;overflow:hidden;margin:8px 0 12px}
.tbar>div{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:99px;transition:width .6s linear}
.q{font-weight:700;font-size:16px;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-top:8px}
.opt:hover{border-color:#c9c4f7}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.lockbox{background:var(--redbg);color:var(--red);padding:12px 14px;border-radius:12px;font-weight:600}
.code{font-family:Consolas,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:1.5px;background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:8px 10px;margin:10px 0;display:inline-block}

/* stars + reviews */
.stars{display:flex;gap:4px;direction:ltr;margin:6px 0 10px}
.st{font-size:30px;background:none;border:none;cursor:pointer;color:#d8d3c4;line-height:1;padding:0 2px}
.st.on{color:#f59e0b}
.revwall{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fffdf7}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.rlock{color:var(--muted)}
.rtime{margin-left:auto;color:var(--muted)}
.stars-s{color:#f59e0b;letter-spacing:2px}
.rcard p{font-size:14px;margin-top:4px;white-space:pre-wrap}
.rewgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sochips{display:flex;flex-wrap:wrap;gap:8px}
.sochip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.sochip small{color:var(--muted);font-weight:500}

/* volunteer */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:26px;display:block}
.stat span{font-size:12px;color:var(--muted)}
table.vt{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.vt th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:2px solid var(--line)}
.vt td{padding:10px 10px;border-bottom:1px solid var(--line)}
.vt tr:last-child td{border-bottom:none}
.vwrap{overflow-x:auto}

/* language picker */
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0 4px;max-height:300px;overflow-y:auto;padding:2px}
.chip{text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;cursor:pointer;line-height:1.3}
.chip b{display:block;font-size:14px}
.chip small{color:var(--muted);font-size:11px}
.chip.sel{border-color:var(--brand);background:var(--brand-soft)}
.chip.sel b{color:var(--brand)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1}

@media(max-width:760px){
  .grid2,.tasks,.rewgrid,.revwall{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:28px}
}

/* print */
#printArea{display:none}
@media print{
  body{background:#fff!important}
  #app,#toast{display:none!important}
  #printArea{display:block!important}
}
.vdoc{width:360px;margin:40px auto;border:3px dashed #b45309;border-radius:16px;overflow:hidden;font-family:var(--font);color:#3d2704}
.vhead{background:#f59e0b;color:#3d2704;text-align:center;font-weight:800;padding:14px;letter-spacing:2px;font-size:16px}
.vbody{padding:18px;text-align:center}
.vcode{font-family:Consolas,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:2px;margin:10px 0}
.vrow{font-size:14px;margin:8px 0}
.vnote{font-size:12px;color:#7c5a1e;margin-top:10px}
.vdate{font-size:12px;color:#7c5a1e;margin-top:6px}
.cdoc{width:700px;max-width:96%;margin:30px auto;border:10px double #b45309;border-radius:6px;padding:8px;background:#fffdf6}
.cinner{border:2px solid #b45309;padding:42px 30px;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#3d2704}
.cbrand{font-family:var(--font);font-weight:800;letter-spacing:3px;font-size:13px;text-transform:uppercase;color:#b45309}
.ctitle{font-size:34px;margin:14px 0;letter-spacing:1px}
.cpres{margin-top:16px;font-size:14px;color:#7c5a1e}
.cname{font-size:32px;font-style:italic;margin:8px 0}
.clock{font-size:15px;margin-bottom:14px}
.cfor{font-size:15px;max-width:420px;margin:0 auto 14px}
.cpts{font-size:15px;margin-bottom:26px}
.cfoot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#7c5a1e;border-top:1px solid #e7d9b8;padding-top:14px}
.csig{font-style:italic}
</style>
</head>

   ------------------------------------------------------------
   HOW TO RUN: just open this file in any browser. Double-click it.
   No Node.js, no install, no build step needed.

   SETTINGS YOU MAY EDIT:
   - Volunteer password: see VOLUNTEER_PASSWORD below.
   - Locker numbers: students register a locker from 1 to MAX_LOCKER.
   - If the month-end lands on a weekend, tasks reset on the next
     school day (Monday). Set WEEKEND_SHIFT to "previous" instead
     if you prefer the Friday before.
   ============================================================ */

/* ---------- settings ---------- */
var VOLUNTEER_PASSWORD = "Siham$muna2";   // <- volunteer panel password (fixed)
var WEEKEND_SHIFT = "next";               // "next" = Saturday/Sunday moves to Monday, "previous" = moves to Friday
var MAX_LOCKER = 1700;                    // students can register lockers 1 .. MAX_LOCKER only

/* ---------- monthly cycle engine ------------------------------
   Not a 30-day timer: tasks reset at the END OF EVERY MONTH.
   If the last day of the month is a Saturday or Sunday, the
   reset is moved to a school day (default: the next Monday).
   Example: Oct 31, 2026 is a Saturday -> reset on Mon Nov 2.  */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function isoDate(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function lastDayOfMonth(y, m){ return new Date(y, m + 1, 0); }
function shiftToSchoolDay(d){
  var wd = d.getDay(); // 0=Sun ... 6=Sat
  if (wd === 6) return addDays(d, WEEKEND_SHIFT === "next" ? 2 : -1); // Sat -> Mon (+2) or Fri (-1)
  if (wd === 0) return addDays(d, WEEKEND_SHIFT === "next" ? 1 : -2); // Sun -> Mon (+1) or Fri (-2)
  return d;
}
function resetDateFor(y, m){ return shiftToSchoolDay(lastDayOfMonth(y, m)); }
function nextResetDate(from){
  var y = from.getFullYear(), m = from.getMonth();
  for (var i = 0; i < 3; i++){
    var r = resetDateFor(y, m + i);
    if (r.getTime() > from.getTime()) return r;
  }
  return resetDateFor(y, m + 3);
}
function cycleKeyFor(from){ return isoDate(nextResetDate(from || new Date())); }

/* ---------- safe storage ------------------------------------
   Some preview panes and privacy modes BLOCK localStorage.
   Reads were already guarded, but an unguarded WRITE crashed
   the click handler (the "Continue after language" bug).
   Now every access is wrapped: if storage is blocked the app
   keeps working in memory for the whole session.            */
var MEM = {};
var STORAGE_OK = (function(){
  try { localStorage.setItem("__ll_probe", "1"); localStorage.removeItem("__ll_probe"); return true; }
  catch (e) { return false; }
})();
function lsGet(k){
  try { return localStorage.getItem(k); } catch (e) { return (k in MEM) ? MEM[k] : null; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; }
}
function lsDel(k){
  try { localStorage.removeItem(k); } catch (e) { delete MEM[k]; }
}
function loadDB(){
  try {
    var d = JSON.parse(lsGet(DB_KEY));
    if (d && d.students) return d;
  } catch (e) {}
  return { students: {}, reviews: [], shoutouts: [] };
}
function save(){ lsSet(DB_KEY, JSON.stringify(DB)); }
function loadSession(){
  try { return JSON.parse(lsGet(SES_KEY)); } catch (e) { return null; }
}
function setSession(s){
  session = s;
  if (s) lsSet(SES_KEY, JSON.stringify(s));
  else lsDel(SES_KEY);
}
function stu(){
  return (session && session.role === "student") ? DB.students[session.locker] : null;
}

/* ---------- locker + password helpers ---------- */
function normLocker(raw){
  var s = (raw === null || raw === undefined ? "" : String(raw)).trim();
  if (!/^\d{1,4}$/.test(s)) return null;
  var n = parseInt(s, 10);
  if (n < 1 || n > MAX_LOCKER) return null;
  return String(n);
}
function findLocker(raw){
  var s = (raw === null || raw === undefined ? "" : String(raw)).trim();
  if (s && DB.students[s]) return s; /* legacy free-form locker keys still log in */
  var n = normLocker(s);
  return (n && DB.students[n]) ? n : null;
}
function encPw(p){ try { return btoa(unescape(encodeURIComponent(p))); } catch (e) { return p; } }
function decPw(h){ if (!h) return ""; try { return decodeURIComponent(escape(atob(h))); } catch (e) { return h; } }

/* ---------- i18n ---------- */
function t(k){
  var st = stu();
  var lang = st ? st.lang : ((session && session.lang) || "en");
  var d = I18N[lang];
  if (d && d[k] !== undefined) return d[k];
  if (I18N.en[k] !== undefined) return I18N.en[k];
  return k;
}
function tf(k, v){ return t(k).replace("{d}", v).replace("{n}", v); }
function localeOf(l){ if (l === "tw") return "zh-TW"; if (l === "fil") return "fil-PH"; return l || "en"; }
function fmtDate(x, lang){
  var d = (x instanceof Date) ? x : new Date(x);
  var o = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  try { return d.toLocaleDateString(localeOf(lang), o); }
  catch (e) { return d.toLocaleDateString("en", o); }
}
function langNative(code){
  for (var i = 0; i < LANGUAGES.length; i++) if (LANGUAGES[i].c === code) return LANGUAGES[i].n;
  return code;
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function v(html){ document.getElementById("view").innerHTML = html; window.scrollTo(0, 0); }
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3400);
}
function onEnt(e, fn){ if (e && e.key === "Enter" && typeof fn === "function") fn(); }
function rel(ts){
  var diff = Date.now() - ts;
  if (diff < 60e3) return t("justNow");
  if (diff < 3600e3) return tf("mAgo", Math.floor(diff / 60e3));
  if (diff < 86400e3) return tf("hAgo", Math.floor(diff / 3600e3));
  return tf("dAgo", Math.floor(diff / 86400e3));
}
function fmtDur(ms){
  var m = Math.max(0, Math.floor(ms / 60000));
  var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d >= 1) return d + "d " + h + "h";
  if (h >= 1) return h + "h " + mm + "m";
  return mm + "m";
}
function fmtClock(sec){ return Math.floor(sec / 60) + ":" + pad2(sec % 60); }
function genCode(lk){
  var r = Math.random().toString(36).slice(2, 6).toUpperCase();
  return "LL-" + lk + "-" + r;
}
function doneCount(s, ck){
  var mods = ["claim", "story", "fact", "riddle", "feedback"], n = 0;
  for (var i = 0; i < mods.length; i++) if (s.cycles[mods[i]] === ck) n++;
  return n;
}

  var st = stu();
  document.body.dir = (st && RTL[st.lang]) ? "rtl" : "ltr";
}
function stashDrafts(){
  var a = document.getElementById("q1in"); if (a) draft.q1 = a.value;
  var b = document.getElementById("q2in"); if (b) draft.q2 = b.value;

/* ---------- points ---------- */
function checkUnlocks(st){
  if (st.points >= VOUCHER_AT && !(st.vouchers && st.vouchers.length))
    st.vouchers = [{ code: genCode(st.locker), ts: Date.now() }];
  if (st.points >= CERT_AT && !(st.certs && st.certs.length))
    st.certs = [{ ts: Date.now() }];
}
function award(st, mod, pts){
  st.points += pts;
  st.cycles[mod] = cycleKeyFor();
  st.updatedOn = Date.now();
  checkUnlocks(st);
  save();
}

function doLogin(){
  var raw = (document.getElementById("lockIn").value || "").trim();
  var pw = (document.getElementById("lPwIn") ? document.getElementById("lPwIn").value : "");
  if (!raw){ toast(t("errorLocker")); return; }
  if (!pw){ toast(t("errorNeedPw")); return; }
  var lk = findLocker(raw);
  if (!lk){ toast(t("errorNotFound")); return; }
  var st = DB.students[lk];
  if (st.pw){
    if (decPw(st.pw) !== pw){ toast(t("errorWrongPw")); return; }
  } else {
    st.pw = encPw(pw); /* account made before passwords existed: this login sets it */
  }
  save();
  setSession({ role: "student", locker: lk });
  riddleRun = null; fbStars = 0;
  render();
  toast(t("welcomeBack") + ", " + st.name + "!");
}
function doSignupStep1(){
  var raw = (document.getElementById("lockIn").value || "").trim();
  var nm = (document.getElementById("nameIn").value || "").trim();
  var pw = (document.getElementById("spwIn") ? document.getElementById("spwIn").value : "");
  if (!raw){ toast(t("errorLocker")); return; }
  var lk = normLocker(raw);
  if (!lk){ toast(t("errorLockerRange")); return; }
  if (DB.students[lk]){ toast(t("errorTaken")); return; }
  if (!nm){ toast(t("errorName")); return; }
  if (pw.length < 4){ toast(t("errorPw")); return; }
  auth.locker = lk; auth.name = nm; auth.pw = pw; auth.step = 2;
  viewLangPick();
}

function topbarStudent(st){
  var opts = "";
  for (var i = 0; i < LANGUAGES.length; i++){
    var L = LANGUAGES[i];
    opts += "<option value='" + L.c + "'" + (L.c === st.lang ? " selected" : "") + ">" + esc(L.n) + "</option>";
  }
  return "<header class='topbar'><div class='brandrow'><span class='logo'>LL</span><b>" + esc(t("appName")) + "</b></div>" +
    "<div class='tright'><span class='muted' style='font-size:12px'>" + esc(t("changeLang")) + "</span>" +
    "<select class='sel' onchange='changeLang(this.value)'>" + opts + "</select>" +
    "<span class='badge brand'><b>" + st.points + "</b> " + esc(t("pts")) + "</span>" +
    "<button class='btn ghost sm' onclick='doLogout()'>" + esc(t("logout")) + "</button></div></header>";

function reviewsWallHTML(list){
  if (!list.length) return "<p class='muted'>" + esc(t("noReviews")) + "</p>";
  var out = "";
  for (var i = 0; i < list.length; i++){
    var r = list[i];
    var stars = "";
    for (var s = 1; s <= 5; s++) stars += (s <= r.stars ? "★" : "☆");
    out += "<div class='rcard'><div class='rhead'><b>" + esc(r.name) + "</b>" +
      "<span class='rlock'>" + esc(t("voucherLocker")) + " " + esc(r.locker) + "</span>" +
      "<span class='stars-s'>" + stars + "</span>" +
      "<span class='rtime'>" + rel(r.ts) + "</span></div>" +
      "<p>" + esc(r.text) + "</p></div>";
  }
  return out;
}

function submitClaim(){
  var st = stu(); if (!st) return;
  var q1 = (draft.q1 || "").trim(), q2 = (draft.q2 || "").trim();
  if (!q1 || !q2){ toast(t("errorBoth")); return; }

  draft.q1 = ""; draft.q2 = "";
  toast(tf("claimDone", fmtDate(nextResetDate(new Date()), st.lang)));
  render();
}
function storyRead(){ var st = stu(); if (!st) return; award(st, "story", POINTS.story); toast(t("storyDone")); render(); }
function factGet(){ var st = stu(); if (!st) return; award(st, "fact", POINTS.fact); toast(t("factDone")); render(); }
function startRiddle(){
  var st = stu(); if (!st) return;
  riddleRun = { locker: st.locker, lang: st.lang, ends: Date.now() + 120000, sel: null };
  render();
}
function pickOpt(i){
  if (!riddleRun) return;
  riddleRun.sel = i;
  var opts = document.querySelectorAll(".opt");
  for (var j = 0; j < opts.length; j++) opts[j].classList.toggle("sel", j === i);
  var go = document.getElementById("riddleGo");
  if (go) go.disabled = false;
}
function riddleFail(msg){
  var st = stu();
  riddleRun = null;
  if (st){ st.riddleLockedUntil = Date.now() + 86400000; save(); }
  toast(msg);
  render();
}
function timeUp(){ riddleFail(t("riddleTimeUp")); }
function riddleSubmit(){
  var st = stu();
  if (!st || !riddleRun) return;
  if (Date.now() > riddleRun.ends){ timeUp(); return; }
  var R = contentFor(riddleRun.lang).riddle;
  if (riddleRun.sel === R.correct){
    award(st, "riddle", POINTS.riddle);
    DB.shoutouts.unshift({ locker: st.locker, name: st.name, ts: Date.now(), cycle: cycleKeyFor() });
    if (DB.shoutouts.length > 100) DB.shoutouts.length = 100;
    riddleRun = null;
    save();
    toast(t("riddleCorrect"));
    render();
  } else {
    riddleFail(t("riddleWrong"));
  }
}
function setStar(i){
  fbStars = i;
  var ss = document.querySelectorAll("#fbStars .st");
  for (var j = 0; j < ss.length; j++) ss[j].classList.toggle("on", j < i);
}
function submitReview(){
  var st = stu(); if (!st) return;
  var txt = (draft.review || "").trim();
  if (fbStars < 1 || !txt){ toast(t("errorReview")); return; }
  DB.reviews.unshift({ locker: st.locker, name: st.name, stars: fbStars, text: txt, ts: Date.now(), lang: st.lang });
  if (DB.reviews.length > 200) DB.reviews.length = 200;
  award(st, "feedback", POINTS.feedback);
  draft.review = ""; fbStars = 0;
  toast(t("reviewDone"));
  render();
}

/* ---------- printing ---------- */
function printVoucher(){
  var st = stu();
  if (!st || !(st.vouchers && st.vouchers[0])) return;
  var vch = st.vouchers[0];
  var pa = document.getElementById("printArea");
  pa.innerHTML = "<div class='vdoc'><div class='vhead'>" + esc(t("voucherFood")) + "</div>" +
    "<div class='vbody'><div id='vqr'></div>" +
    "<div class='vcode'>" + esc(vch.code) + "</div>" +
    "<div class='vrow'>" + esc(t("voucherLocker")) + ": <b>" + esc(st.locker) + "</b> · " + esc(t("certPoints")) + ": <b>" + st.points + "</b></div>" +
    "<div class='vnote'>" + esc(t("voucherNote")) + "</div>" +
    "<div class='vdate'>" + fmtDate(Date.now(), st.lang) + "</div></div></div>";
  if (window.QRCode){
    try { new QRCode(document.getElementById("vqr"), { text: vch.code, width: 110, height: 110 }); } catch (e) {}
  }
  setTimeout(function(){ window.print(); }, 250);
}
function printCertificate(){
  var st = stu();
  if (!st || !(st.certs && st.certs[0])) return;
  var pa = document.getElementById("printArea");
  pa.innerHTML = "<div class='cdoc'><div class='cinner'>" +
    "<div class='cbrand'>" + esc(t("appName")) + "</div>" +
    "<div class='ctitle'>" + esc(t("certTitle")) + "</div>" +
    "<div class='cpres'>" + esc(t("certPresented")) + "</div>" +
    "<div class='cname'>" + esc(st.name) + "</div>" +
    "<div class='clock'>" + esc(t("voucherLocker")) + " " + esc(st.locker) + "</div>" +
    "<p class='cfor'>" + esc(t("certFor")) + "</p>" +
    "<div class='cpts'>" + esc(t("certPoints")) + ": <b>" + st.points + "</b></div>" +
    "<div class='cfoot'><span>" + fmtDate(Date.now(), st.lang) + "</span><span class='csig'>" + esc(t("certSignature")) + " _______________</span></div>" +
    "</div></div>";
  setTimeout(function(){ window.print(); }, 250);
}

/* ---------- ticking timer (riddle + retry cooldown) ---------- */
function onTick(){
  var el = document.getElementById("riddleTime");
  if (riddleRun && el){
    var left = Math.max(0, Math.ceil((riddleRun.ends - Date.now()) / 1000));
    el.textContent = fmtClock(left);
    var bar = document.getElementById("riddleBar");
    if (bar) bar.style.width = (left / 120 * 100) + "%";
    if (left <= 0) timeUp();
  }
  var rc = document.getElementById("retryCd");
  if (rc){
    var st = stu();
    if (st && (st.riddleLockedUntil || 0) > Date.now()) rc.textContent = fmtDur(st.riddleLockedUntil - Date.now());
    else if (st) render();
  }
}

/* ---------- go ---------- */
render();
setInterval(onTick, 1000);
window.addEventListener("afterprint", function(){ document.getElementById("printArea").innerHTML = ""; });
window.addEventListener("error", function(ev){
  try { toast("Error: " + ((ev && ev.message) || "unknown") ); } catch (e) {}
});
if (!STORAGE_OK)
  toast("Preview mode: this view blocks saving, so data lasts only this session. Download the file and open it in your browser to keep data.");
</script>
</body>
</html>
